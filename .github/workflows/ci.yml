name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned deps (numpy==2.5.2, scipy==1.18.1) require Python >=3.12,
        # so 3.11 is intentionally not tested here.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          echo "ruff OK"

      - name: Compile check (py_compile all modules)
        run: |
          python -m compileall -q backend/api backend/dashboard backend/drivers backend/evidence backend/personas backend/scenarios backend/actions backend/anomaly backend/causal backend/feedback backend/ingestion backend/materiality backend/nlp backend/security backend/telemetry backend/roi backend/evaluation llm
          echo "compileall OK"

      - name: Run tests (with coverage)
        env:
          # backend/ on the import path so `api`, `drivers`, ... resolve;
          # `llm` resolves from the repo root.
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests --cov=api --cov=analytics --cov=evidence --cov=materiality --cov=llm --cov=security --cov=feedback --cov=roi --cov=drivers --cov=causal --cov=forecasting --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false