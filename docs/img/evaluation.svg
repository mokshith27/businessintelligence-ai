<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1080" height="330" fill="#ffffff"/>
  <text x="540" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2733">Narrative Governance — Measured, Not Claimed</text>
  <text x="540" y="61" text-anchor="middle" font-size="12" fill="#5a6472">Results from the shipped evaluation harness (evaluation/run_evaluation.py) · model: openai/gpt-oss-120b</text>

  <!-- Card 1: hallucination containment -->
  <rect x="30" y="85" width="245" height="130" rx="10" fill="#eaf7ee" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="152" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#2e8b57">HALLUCINATION CONTAINMENT</text>
  <text x="152" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#1c2733">12 / 12</text>
  <text x="152" y="170" text-anchor="middle" font-size="11" fill="#5a6472">seeded hallucinations caught</text>
  <text x="152" y="192" text-anchor="middle" font-size="11" fill="#5a6472">6 validation checks · precision 1.00</text>
  <text x="152" y="207" text-anchor="middle" font-size="11" fill="#5a6472">recall 1.00 · 0 false positives</text>

  <!-- Card 2: acceptance -->
  <rect x="295" y="85" width="245" height="130" rx="10" fill="#e8f1fb" stroke="#2f6fb2" stroke-width="1.5"/>
  <text x="417" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fb2">NARRATIVE ACCEPTANCE</text>
  <text x="417" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#1c2733">100%</text>
  <text x="417" y="170" text-anchor="middle" font-size="11" fill="#5a6472">validator pass rate (2 / 2 narratives)</text>
  <text x="417" y="192" text-anchor="middle" font-size="11" fill="#5a6472">analyst feedback: 7 correct · 0 incorrect</text>
  <text x="417" y="207" text-anchor="middle" font-size="11" fill="#5a6472">2 flagged missing context</text>

  <!-- Card 3: cost / latency -->
  <rect x="560" y="85" width="245" height="130" rx="10" fill="#fdf3e2" stroke="#c07f1d" stroke-width="1.5"/>
  <text x="682" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#c07f1d">COST &amp; LATENCY</text>
  <text x="682" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#1c2733">$0.00052</text>
  <text x="682" y="170" text-anchor="middle" font-size="11" fill="#5a6472">per grounded narrative (mean)</text>
  <text x="682" y="192" text-anchor="middle" font-size="11" fill="#5a6472">≈ $0.52 per 1,000 narratives</text>
  <text x="682" y="207" text-anchor="middle" font-size="11" fill="#5a6472">mean latency 2.25 s · 1,854 tokens</text>

  <!-- Card 4: calibration -->
  <rect x="825" y="85" width="225" height="130" rx="10" fill="#f2ecfa" stroke="#7b3fb5" stroke-width="1.5"/>
  <text x="937" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#7b3fb5">FEEDBACK CALIBRATION</text>
  <text x="937" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#1c2733">ECE 0.62</text>
  <text x="937" y="170" text-anchor="middle" font-size="11" fill="#5a6472">measured, governed by policy</text>
  <text x="937" y="192" text-anchor="middle" font-size="11" fill="#5a6472">no auto-override from small</text>
  <text x="937" y="207" text-anchor="middle" font-size="11" fill="#5a6472">feedback samples</text>

  <text x="540" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#8c2f28">What the validator rejects: fabricated numbers · overclaimed statuses · stripped uncertainty · wrong currency · causal overreach · invented driver claims</text>
  <text x="540" y="274" text-anchor="middle" font-size="10.5" fill="#8a93a0">A narrative that fails any check is never shown as trusted — the deterministic analysis remains authoritative.</text>
  <text x="540" y="305" text-anchor="middle" font-size="10.5" fill="#8a93a0">Reproduce: python evaluation/run_evaluation.py → data/evaluation/evaluation_report.json</text>
</svg>
