<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1c2733" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1080" height="470" fill="#ffffff"/>

  <text x="540" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#1c2733">BusinessIntelligence.ai — Decision Pipeline</text>
  <text x="540" y="64" text-anchor="middle" font-size="12.5" fill="#5a6472">The analytical layer determines the truth; the LLM explains that truth.</text>

  <!-- ================= ROW 1 ================= -->
  <rect x="30" y="100" width="180" height="58" rx="10" fill="#e8f1fb" stroke="#2f6fb2" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="120" y="124" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2733">KPI movement</text>
  <text x="120" y="142" text-anchor="middle" font-size="10.5" fill="#5a6472">daily KPIs · DuckDB</text>

  <rect x="250" y="100" width="180" height="58" rx="10" fill="#e8f1fb" stroke="#2f6fb2" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="340" y="124" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2733">Materiality detection</text>
  <text x="340" y="142" text-anchor="middle" font-size="10.5" fill="#5a6472">statistical × business impact</text>

  <rect x="470" y="100" width="180" height="58" rx="10" fill="#e8f1fb" stroke="#2f6fb2" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="560" y="124" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2733">Event clustering</text>
  <text x="560" y="142" text-anchor="middle" font-size="10.5" fill="#5a6472">anomalous day grouping</text>

  <rect x="690" y="100" width="180" height="58" rx="10" fill="#fdf3e2" stroke="#c07f1d" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="780" y="124" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2733">Driver contribution</text>
  <text x="780" y="142" text-anchor="middle" font-size="10.5" fill="#5a6472">where did it happen</text>

  <rect x="910" y="100" width="140" height="58" rx="10" fill="#fdf3e2" stroke="#c07f1d" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="980" y="118" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2733">Review /</text>
  <text x="980" y="133" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2733">sentiment evidence</text>
  <text x="980" y="149" text-anchor="middle" font-size="10.5" fill="#5a6472">unstructured</text>

  <line x1="210" y1="129" x2="244" y2="129" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="430" y1="129" x2="464" y2="129" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="650" y1="129" x2="684" y2="129" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="870" y1="129" x2="904" y2="129" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>

  <path d="M 980 158 L 980 195 L 100 195 L 100 232" fill="none" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= ROW 2 (right to left flow) ================= -->
  <rect x="910" y="232" width="140" height="58" rx="10" fill="#fdf3e2" stroke="#c07f1d" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="980" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2733">Business context</text>
  <text x="980" y="274" text-anchor="middle" font-size="10.5" fill="#5a6472">calendar · campaigns</text>

  <rect x="690" y="232" width="180" height="58" rx="10" fill="#fdf3e2" stroke="#c07f1d" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="780" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2733">Evidence fusion</text>
  <text x="780" y="274" text-anchor="middle" font-size="10.5" fill="#5a6472">structured + unstructured</text>

  <rect x="470" y="232" width="180" height="58" rx="10" fill="#eaf7ee" stroke="#2e8b57" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="560" y="250" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2733">Confidence + abstention</text>
  <text x="560" y="266" text-anchor="middle" font-size="10.5" fill="#5a6472">ABSTAIN when evidence</text>
  <text x="560" y="280" text-anchor="middle" font-size="10.5" fill="#5a6472">is insufficient</text>

  <rect x="250" y="232" width="180" height="58" rx="10" fill="#eaf7ee" stroke="#2e8b57" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="340" y="256" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1c2733">Recommended action</text>
  <text x="340" y="274" text-anchor="middle" font-size="10.5" fill="#5a6472">safe, prescriptive play</text>

  <rect x="30" y="232" width="180" height="58" rx="10" fill="#f2ecfa" stroke="#7b3fb5" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="120" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2733">Role-specific narrative</text>
  <text x="120" y="266" text-anchor="middle" font-size="10.5" fill="#5a6472">LLM + grounding validator</text>
  <text x="120" y="280" text-anchor="middle" font-size="10.5" fill="#5a6472">(exec / ops / analyst)</text>

  <line x1="910" y1="261" x2="876" y2="261" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="690" y1="261" x2="656" y2="261" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="470" y1="261" x2="436" y2="261" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="250" y1="261" x2="216" y2="261" stroke="#5a6472" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= GUARDRAIL BAND ================= -->
  <rect x="30" y="322" width="1020" height="42" rx="10" fill="#fbeceb" stroke="#b3423a" stroke-width="1.4"/>
  <text x="540" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#8c2f28">GOVERNANCE GUARDRAILS (cross-cutting)</text>
  <text x="540" y="356" text-anchor="middle" font-size="11" fill="#8c2f28">numeric-claim validator · hallucination seeds eval · JWT + role filtering · feedback calibration (ECE) · token/latency telemetry</text>

  <!-- ================= LEGEND ================= -->
  <text x="30" y="398" font-size="11.5" font-weight="700" fill="#5a6472">PHASES</text>
  <rect x="95" y="388" width="12" height="12" rx="3" fill="#e8f1fb" stroke="#2f6fb2" stroke-width="1.4"/>
  <text x="113" y="398" font-size="11.5" fill="#1c2733">1 · Detect</text>
  <rect x="195" y="388" width="12" height="12" rx="3" fill="#fdf3e2" stroke="#c07f1d" stroke-width="1.4"/>
  <text x="213" y="398" font-size="11.5" fill="#1c2733">2 · Investigate</text>
  <rect x="320" y="388" width="12" height="12" rx="3" fill="#eaf7ee" stroke="#2e8b57" stroke-width="1.4"/>
  <text x="338" y="398" font-size="11.5" fill="#1c2733">3 · Decide</text>
  <rect x="425" y="388" width="12" height="12" rx="3" fill="#f2ecfa" stroke="#7b3fb5" stroke-width="1.4"/>
  <text x="443" y="398" font-size="11.5" fill="#1c2733">4 · Explain (LLM, grounded)</text>
  <text x="1050" y="398" text-anchor="end" font-size="10.5" fill="#8a93a0">ROI back-test: R$17.5k recoverable GMV · events flagged on first anomalous day</text>

  <text x="540" y="440" text-anchor="middle" font-size="10.5" fill="#8a93a0">Deliberately conservative: a large % movement is not automatically a meaningful event · an observed contributor is not automatically the root cause</text>
</svg>
