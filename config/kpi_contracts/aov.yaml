kpi:
  id: average_order_value

  name: Average Order Value

  description: >
    Average merchandise value per unique marketplace order.

  formula: "SUM(item.price) / COUNT(DISTINCT order_id)"

  base_grain: order

  aggregation_grain:
    - day
    - week
    - month

  dimensions:
    - customer_state
    - seller_state
    - category_name

  primary_date: order_purchase_timestamp

  drivers:
    - product_mix
    - price_mix
    - units_per_order
    - category_mix

  materiality:
    min_relative_change: 0.05
    min_absolute_change: 10

  anomaly:
    baseline: seasonal
    comparison_window_weeks: 8
    z_score_threshold: 2.0

  lineage:
    - fact_order_items_enriched.price
    - fact_order_items_enriched.order_id

  access_roles:
    - executive
    - operations

  sensitivity: internal
